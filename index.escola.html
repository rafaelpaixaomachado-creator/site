<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cadastro - Curso de Informática</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f4f8;
    margin: 0;
    padding: 40px 20px;
    color: #1f2937;
  }
  form {
    max-width: 640px;
    margin: 0 auto;
    background: #ffffff;
    padding: 32px 40px 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 1.5rem;
    color: #0f172a;
    margin-bottom: 4px;
  }
  p.subtitle {
    color: #64748b;
    margin-top: 0;
    margin-bottom: 28px;
    font-size: 0.95rem;
  }
  fieldset {
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 16px 20px 20px;
    margin-bottom: 20px;
  }
  legend {
    font-weight: 600;
    color: #334155;
    padding: 0 8px;
  }
  label {
    display: block;
    margin-top: 14px;
    margin-bottom: 6px;
    font-weight: 500;
    font-size: 0.9rem;
    color: #334155;
  }
  input[type="text"],
  input[type="email"],
  input[type="tel"],
  input[type="date"],
  input[type="number"],
  select,
  textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }
  .radio-group, .checkbox-group {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 8px;
  }
  .radio-group label, .checkbox-group label {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    font-weight: 400;
    font-size: 0.92rem;
  }
  .radio-group input, .checkbox-group input {
    width: auto;
    accent-color: #2563eb;
  }
  textarea {
    resize: vertical;
    min-height: 90px;
  }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 12px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: #1d4ed8; }
  .obrigatorio { color: #dc2626; }
</style>
</head>
<body>

<form action="#" method="post">
  <h1>Cadastro - Curso de Informática</h1>
  <p class="subtitle">Preencha os dados abaixo para se inscrever no curso.</p>

  <fieldset>
    <legend>Dados pessoais</legend>

    <label for="nome">Nome completo <span class="obrigatorio">*</span></label>
    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

    <label for="nascimento">Data de nascimento <span class="obrigatorio">*</span></label>
    <input type="date" id="nascimento" name="nascimento" required>

    <label for="email">E-mail <span class="obrigatorio">*</span></label>
    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>

    <label for="telefone">Telefone / WhatsApp</label>
    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">

    <label>Sexo</label>
    <div class="radio-group">
      <label><input type="radio" name="sexo" value="feminino"> Feminino</label>
      <label><input type="radio" name="sexo" value="masculino"> Masculino</label>
      <label><input type="radio" name="sexo" value="outro"> Outro</label>
      <label><input type="radio" name="sexo" value="prefiro_nao_dizer"> Prefiro não dizer</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Dados do curso</legend>

    <label for="nivel">Nível de conhecimento em informática <span class="obrigatorio">*</span></label>
    <select id="nivel" name="nivel" required>
      <option value="">Selecione uma opção</option>
      <option value="iniciante">Iniciante</option>
      <option value="intermediario">Intermediário</option>
      <option value="avancado">Avançado</option>
    </select>

    <label for="turno">Turno de preferência <span class="obrigatorio">*</span></label>
    <select id="turno" name="turno" required>
      <option value="">Selecione uma opção</option>
      <option value="manha">Manhã</option>
      <option value="tarde">Tarde</option>
      <option value="noite">Noite</option>
    </select>

    <label>Áreas de interesse dentro do curso</label>
    <div class="checkbox-group">
      <label><input type="checkbox" name="interesses" value="informatica_basica"> Informática básica</label>
      <label><input type="checkbox" name="interesses" value="excel"> Excel</label>
      <label><input type="checkbox" name="interesses" value="internet_email"> Internet e e-mail</label>
      <label><input type="checkbox" name="interesses" value="programacao"> Programação</label>
      <label><input type="checkbox" name="interesses" value="design_grafico"> Design gráfico</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Informações adicionais</legend>

    <label for="observacoes">Observações ou necessidades especiais</label>
    <textarea id="observacoes" name="observacoes" placeholder="Ex: possui alguma deficiência, necessita de acompanhamento especial, etc."></textarea>

    <div class="checkbox-group" style="margin-top:16px;">
      <label><input type="checkbox" name="termos" value="aceito" required> Li e aceito os termos de inscrição <span class="obrigatorio">*</span></label>
    </div>
  </fieldset>

  <button type="submit">Enviar cadastro</button>
</form>

</body>
</html>
