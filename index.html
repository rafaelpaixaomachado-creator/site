<!DOCTYPE html>
<html>
<body> 
<form>
  <table>
    <!-- Linha do Nome -->
    <tr>
      <td><label for="nome">Nome Completo:</label></td>
      <td><input type="text" id="nome" name="nome_aluno"></td>
    </tr>
    <!-- Linha da Data de Nascimento -->
    <tr>
      <td><label for="nasc">Data de Nascimento:</label></td>
      <td><input type="date" id="nasc" name="data_nasc"></td>
    </tr>
    <!-- Linha da Série -->
    <tr>
      <td><label for="serie">Série/Ano:</label></td>
      <td>
        <select id="serie" name="serie_aluno">
          <option value="1em">1º Ano Ensino Médio</option>
          <option value="2em">2º Ano Ensino Médio</option>
        </select>
      </td>
    </tr>
  </table>
</form>
</body>
</html>
